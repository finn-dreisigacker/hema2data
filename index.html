<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- connect-src 'self': the page can only load its own files (Pyodide, wheels, backend.py); no other host is reachable. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'; img-src 'self' blob: data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Hema2Data</title>
<meta name="description" content="Blutbild-PDFs lokal im Browser in eine geprüfte Excel-Tabelle umwandeln.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#f2f4f7">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="page">

<header class="bar">
  <div class="brand" id="brand" hidden>
    <img class="logo-sm" src="icons/icon.svg" alt="" width="28" height="28">
    <span class="brand-name">Hema2Data</span>
  </div>
  <div class="bar-actions">
    <button class="btn btn-ghost" id="install" hidden data-i18n="install"></button>
    <button class="btn btn-ghost" id="restart" hidden data-i18n="restart"></button>
    <div class="seg" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- 1. start: the whole screen is the drop area -->
  <section id="start" class="drop">
    <img class="logo" src="icons/icon.svg" alt="" width="72" height="72">
    <h1 class="app-name">Hema2Data</h1>
    <p class="lead" data-i18n="dropTitle"></p>
    <div class="row">
      <label class="btn btn-primary"><input type="file" id="pick-files" accept="application/pdf,.pdf" multiple class="sr-only"><span data-i18n="pickFiles"></span></label>
      <label class="btn btn-secondary"><input type="file" id="pick-folder" webkitdirectory multiple class="sr-only"><span data-i18n="pickFolder"></span></label>
    </div>
    <p class="muted local"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="local"></span></p>
  </section>

  <!-- 2. loading -->
  <section id="loading" class="panel loading" role="status" aria-live="polite" hidden>
    <svg class="spin" aria-hidden="true" width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke="#e6e6e6" stroke-width="3.5"/><path d="M20 4a16 16 0 0 1 16 16" stroke="#141414" stroke-width="3.5" stroke-linecap="round"/></svg>
    <p class="loading-text" id="loading-text"></p>
    <div class="track"><div class="track-fill" id="track-fill"></div></div>
    <p class="muted" data-i18n="local"></p>
  </section>

  <!-- 3. result -->
  <section id="done" class="stack" hidden>
    <div id="notice" class="notice" role="status"></div>

    <section class="panel" aria-labelledby="files-h">
      <h2 id="files-h" class="panel-title" data-i18n="files"></h2>
      <div class="scroll-x">
        <table class="files">
          <thead><tr>
            <th scope="col" data-i18n="colFile"></th>
            <th scope="col" data-i18n="colParticipant"></th>
            <th scope="col" class="num" data-i18n="colDate"></th>
            <th scope="col" data-i18n="colStatus"></th>
            <th scope="col"><span class="sr-only" data-i18n="colAction"></span></th>
          </tr></thead>
          <tbody id="file-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" aria-labelledby="preview-h">
      <div class="panel-head">
        <h2 id="preview-h" class="panel-title" data-i18n="preview"></h2>      </div>
      <div class="sheet" id="sheet"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
    </section>

    <section class="panel export" aria-labelledby="export-h">
      <div class="export-name">
        <h2 id="export-h" class="panel-title flush"><label for="filename">Excel:</label></h2>
        <input id="filename" class="filename" type="text" spellcheck="false" autocomplete="off">
        <p class="muted" data-i18n="exportHint"></p>
        <details class="advanced">
          <summary data-i18n="advanced"></summary>
          <label><input type="checkbox" data-sheet="Check"> <span data-i18n="addCheck"></span></label>
        </details>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="download">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span data-i18n="download"></span>
        </button>
      </div>
    </section>

    <label class="more">
      <input type="file" id="pick-more" accept="application/pdf,.pdf" multiple class="sr-only">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
      <span data-i18n="more"></span>
    </label>
  </section>
</main>

<footer class="foot muted small"><span data-i18n="madeBy"></span> <a href="#" id="mail">Finn Dreisigacker</a> · <a href="https://github.com/finn-dreisigacker/hema2data" rel="noopener">GitHub</a></footer>
</div>
<div class="dropping" id="dropping" hidden><span data-i18n="dropNow"></span></div>
</body>
</html>
